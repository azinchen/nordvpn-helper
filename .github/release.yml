# Categories for GitHub's auto-generated release notes ("Generate release
# notes" button / API). PRs are sorted by label into the first category that
# matches, so the order matters: Dependabot PRs carry both "dependencies"
# and "github-actions" and must hit the CI/CD section, while the maintenance
# Dependabot is the only bot here, so "dependencies" alone means a Package
# Updates entry. Titles follow the release format used across the azinchen
# images (see azinchen/nordvpn/.github/RELEASE_TEMPLATE.md).
changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - wontfix
  categories:
    - title: 💥 Breaking changes
      labels:
        - breaking
    - title: 🔒 Security
      labels:
        - security
    - title: ✨ Features
      labels:
        - enhancement
        - feature
    - title: 🐛 Bug Fixes
      labels:
        - bug
        - fix
    - title: ♻️ Refactoring
      labels:
        - refactor
    - title: 🔧 CI/CD Updates
      labels:
        - github-actions
        - automation
        - ci
    - title: 📦 Package Updates
      labels:
        - dependencies
    - title: 📖 Documentation
      labels:
        - documentation
    - title: 🧹 Other changes
      labels:
        - "*"
